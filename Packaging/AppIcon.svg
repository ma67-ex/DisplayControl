<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Backdrop -->
    <radialGradient id="studioDark" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="55%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>

    <!-- Metallic Edge Highlight (Space Black / Dark Titanium) -->
    <linearGradient id="titaniumRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#4B5563" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1F242D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Blank Turned-Off Screen Glass -->
    <linearGradient id="blankGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="50%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020304"/>
    </linearGradient>

    <!-- Soft Ambient Screen Glass Sheen -->
    <linearGradient id="glassSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Stand Brushed Metal -->
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C24"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <!-- Delicate Under-glow Filter -->
    <filter id="standShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas / Tile -->
  <rect width="512" height="512" rx="104" fill="url(#studioDark)"/>

  <!-- Outer Hairline Canvas Border -->
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="#161822" stroke-width="1.2"/>

  <!-- Monitor Assembly Group (Centered & Balanced) -->
  <g transform="translate(66, 84)" filter="url(#standShadow)">
    <!-- Stand Neck -->
    <path d="M 174 246 L 206 246 L 210 326 L 170 326 Z" fill="url(#standGrad)" stroke="#222530" stroke-width="1.2"/>
    <line x1="174" y1="246" x2="206" y2="246" stroke="#3A3F50" stroke-width="1"/>

    <!-- Stand Base (Precision Chamfered Symmetrical Base) -->
    <rect x="115" y="324" width="150" height="6" rx="3" fill="#14161E" stroke="#2D3242" stroke-width="1.2"/>
    <line x1="117" y1="324" x2="263" y2="324" stroke="#484F65" stroke-width="1"/>

    <!-- Outer Display Chassis (Matte Black Titanium Frame) -->
    <rect x="0" y="0" width="380" height="250" rx="18" fill="#0D0E13" stroke="url(#titaniumRim)" stroke-width="1.8"/>

    <!-- Razor-thin Bezel Inner Border -->
    <rect x="5" y="5" width="370" height="240" rx="14" fill="#060709" stroke="#14161E" stroke-width="1"/>

    <!-- Blank Display Screen (Turned Off / Pure Smoked Glass) -->
    <rect x="8" y="8" width="364" height="234" rx="11" fill="url(#blankGlass)"/>

    <!-- Subtle Diagonal Studio Reflection Across the Blank Glass -->
    <polygon points="8,8 240,8 90,242 8,242" fill="url(#glassSheen)"/>

    <!-- Minimal Subtle Power Indicator (Dim Stealth LED) -->
    <circle cx="190" cy="246" r="1.2" fill="#4B5563"/>
  </g>
</svg>
